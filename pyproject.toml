[project]
name = "pisaxecair"
version = "0.2.0"
description = "PISA × ECAIR: school conditions and learning outcomes in Southeast Asia (preprocessing + modelling pipeline)"
readme = "README.md"
requires-python = ">=3.11"
# Lower bounds follow the versions used for the Version 5 analysis (PISAxECAIR-Research uv.lock).
dependencies = [
    "pandas>=3.0.1",
    "numpy>=2.4.2",
    "scikit-learn>=1.8.0",
    "pyreadstat>=1.3.3",
    "rich>=13.0",
    "statsmodels>=0.14.4",
    "xgboost>=3.2.0",
    "optuna>=4.7.0",
    "shap>=0.49.1",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "config",
    "data_schema",
    "preprocess",
    "reporting",
    "escs",
    "econometrics",
    "ml_models",
    "counterfactuals",
    "pipeline",
]
